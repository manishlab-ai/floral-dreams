{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        {% if product.image %}
            <img
                src="{{ product.image.url }}"
                alt="{{ product.name }}"
                class="img-fluid rounded"
                style="max-height: 450px; width: 100%; object-fit: cover;"
            >
        {% endif %}
    </div>

    <div class="col-md-6">
        <h1>{{ product.name }}</h1>

        <p class="text-muted">
            {{ product.desc }}
        </p>

        <h3 class="text-success">
            Price: ₹{{ product.price }}
        </h3>

        <hr>

        <a href="/buynow/?pid={{ product.id }}" class="btn btn-success">
            Buy Now
        </a>

        <a href="/" class="btn btn-secondary">
            Back to Products
        </a>
    </div>
</div>
{% endblock %}
